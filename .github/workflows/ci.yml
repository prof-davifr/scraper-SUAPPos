# Verificação sem rede institucional e sem credencial: lint e testes das
# funções puras. A coleta em si não roda aqui, porque o runner público não
# alcança o SUAP e a senha não sai do cofre da máquina que coleta.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    env:
      # Vazios de propósito: o Config não procura senha no cofre sem usuário.
      SUAP_USERNAME: ""
      SUAP_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff

      - name: Lint
        run: ruff check --select E4,E7,E9,F .

      - name: Testes
        run: pytest -q
